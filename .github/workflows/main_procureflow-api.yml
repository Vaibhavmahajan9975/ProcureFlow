name: Build and deploy ASP.Net Core app to Azure Web App - procureflow-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore backend/src/ProcureFlow.API/ProcureFlow.API.csproj

      - name: Build
        run: dotnet build backend/src/ProcureFlow.API/ProcureFlow.API.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish backend/src/ProcureFlow.API/ProcureFlow.API.csproj --configuration Release --no-build --output "${{ github.workspace }}/publish"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ github.workspace }}/publish

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_03D790B83A64439984B7FAB39CAF173D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_725300E543544375BA49E618E76B2FF1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_88F6022AD46F4EBA807380AB388B922F }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'procureflow-api'
          slot-name: 'Production'
          package: ./publish
